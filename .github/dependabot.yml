version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Its versions are Rust toolchains: @stable follows releases and
      # @1.88.0 is the minimum supported version, pinned on purpose.
      - dependency-name: dtolnay/rust-toolchain
