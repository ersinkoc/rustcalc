name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  publish:
    if: github.repository == 'ersinkoc/rustcalc'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authoritative tag and main ancestry
        run: pwsh -NoProfile -File scripts/verify-release-tag.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:GITHUB_SHA
      - name: Download the exact package tested by the check job
        uses: actions/download-artifact@v4
        with:
          name: RustCalc-Windows-x64
          path: dist
      - name: Verify, upload or resume matching draft, then publish
        run: pwsh -NoProfile -File scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:GITHUB_SHA
