name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  publish:
    if: github.repository == 'ersinkoc/rustcalc'
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify authoritative tag and main ancestry
        run: pwsh -NoProfile -File scripts/verify-release-tag.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:GITHUB_SHA
      - name: Download the exact packages tested on Windows, Linux and macOS
        uses: actions/download-artifact@v4
        with:
          pattern: RustCalc-*
          path: dist
          merge-multiple: true
      - name: Write one checksum manifest for every platform
        run: pwsh -NoProfile -File scripts/assemble-release.ps1 -Directory dist
      - name: Verify, upload or resume matching draft, then publish
        run: pwsh -NoProfile -File scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:GITHUB_SHA
