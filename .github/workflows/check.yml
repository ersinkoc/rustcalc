name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - name: Installer integration (PowerShell 7)
        run: pwsh -NoProfile -File scripts/test-install.ps1
      - name: Installer integration (Windows PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
      - run: pwsh -NoProfile -File scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RustCalc-Windows-x64
          path: |
            dist/rustcalc-windows-x86_64.exe
            dist/rustcalc-v*-windows-x86_64.zip
            dist/install.ps1
            dist/uninstall.ps1
            dist/SHA256SUMS
  msrv:
    name: Rust 1.88 minimum version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --locked
