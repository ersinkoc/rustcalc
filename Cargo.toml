[package]
name = "rustcalc"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A thoughtful, offline desktop calculator built in Rust"
license = "MIT"
authors = ["Ersin Koç"]
repository = "https://github.com/ersinkoc/rustcalc"
homepage = "https://github.com/ersinkoc/rustcalc"
readme = "README.md"
keywords = ["calculator", "desktop", "scientific", "windows", "egui"]
categories = ["mathematics", "gui"]
default-run = "rustcalc"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland"] }
rust_decimal = "1.40"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tempfile = "3"
self-replace = "1.5"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
