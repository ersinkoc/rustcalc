[package]
name = "rustcalc"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "A thoughtful, offline desktop calculator built in Rust"
license = "MIT"
authors = ["Ersin Koç"]
repository = "https://github.com/ersinkoc/rustcalc"
homepage = "https://github.com/ersinkoc/rustcalc"
readme = "README.md"
keywords = ["calculator", "desktop", "scientific", "windows", "egui"]
categories = ["mathematics", "gui"]
default-run = "rustcalc"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland"] }
rust_decimal = "1.40"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tempfile = "3"
rfd = "0.17.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
# Line tables keep backtraces useful while Linux test binaries, which embed
# debug info, stay under the updater's 64 MiB asset limit in tests.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
